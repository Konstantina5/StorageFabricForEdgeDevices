version: "3.8"

services:
  spark-master:
    image: apache/spark:4.0.0-scala2.13-java17-ubuntu
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: [ "/bin/bash", "-c", "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master" ]
    networks:
      - sqlite

  spark-worker-1:
    image: apache/spark:4.0.0-scala2.13-java17-ubuntu
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    command: ["/bin/bash", "-c", "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"]
    networks:
      - sqlite

networks:
  sqlite:
    external: true
    name: spark-network
