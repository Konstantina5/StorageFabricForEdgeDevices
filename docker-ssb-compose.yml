      DISCOVERY: "server"
      PLACEMENT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - ./generate_data/ssb:/mnt/databases
    networks:
      - sqlite

  sqlite-part:
