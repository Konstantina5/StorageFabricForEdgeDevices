version: "3.2"

services:
  sqlite-customer:
    image: edge-sqlite-db:1.0.0
    hostname: customer
    ports:
      - 29001:8080
    environment:
      DB_NAME: "customer"
      BASE_URL: "http://customer:8080/api"
      HOSTNAME: "customer"
      DISCOVERY: "server"
      CLUSTER_HEAD: "true"
      PLACEMENT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - ./generate_data/ssb:/mnt/databases
    networks:
      - sqlite

  sqlite-supplier:
    image: edge-sqlite-db:1.0.0
    hostname: supplier
    ports:
      - 29002:8080
    environment:
      DB_NAME: "supplier"
