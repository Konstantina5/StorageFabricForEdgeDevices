      DISCOVERY: "server"
      PLACEMENT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - ./generate_data/ssb:/mnt/databases
    networks:
      - sqlite

  sqlite-date:
    image: edge-sqlite-db:1.0.0
    hostname: date
    ports:
      - 29004:8080
    environment:
      DB_NAME: "date_table"
      BASE_URL: "http://date:8080/api"
      HOSTNAME: "date"
      DISCOVERY: "server"
      PLACEMENT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - ./generate_data/ssb:/mnt/databases
    networks:
      - sqlite

  sqlite-lineorder:
    image: edge-sqlite-db:1.0.0
    hostname: lineorder
    ports:
      - 29005:8080
    environment:
      DB_NAME: "lineorder"
      BASE_URL: "http://lineorder:8080/api"
      HOSTNAME: "lineorder"
      DISCOVERY: "server"
      PLACEMENT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
