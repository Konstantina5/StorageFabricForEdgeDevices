version: "3.2"

services:
  sqlite-client:
    image: edge-sqlite-db:1.0.0
    hostname: client
    networks:
      - sqlite
    ports:
      - 29001:8080
    environment:
      DB_NAME: "orders"
      BASE_URL: "http://localhost:29001"
      DISCOVERY: "server"
      HOSTNAME: "client1"
      CLUSTER_HEAD: "true"
      PLACEMENT: "false"
      JAVA_OPTS: "-Xms512m -Xmx1g"
      SIZE: "512"
    volumes:
      - ./generate_data:/mnt/databases

networks:
  sqlite:

volumes:
  sqlite_databases:
    driver: local